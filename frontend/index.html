<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkillPulse — Job Market Skill Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F7F5;
  --surface: #FFFFFF;
  --surface-2: #F0F0ED;
  --ink: #16181D;
  --muted: #5B6169;
  --faint: #8A8F97;
  --border: #E2E1DC;
  --amber: #B96F1E;
  --amber-soft: #F4E3CC;
  --teal: #1F6F6B;
  --teal-soft: #DCEAE8;
  --red: #B23B3B;
  --focus: #1F6F6B;
  --radius: 7px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #2A2C30;
  --surface: #34363B;
  --surface-2: #3C3E44;
  --ink: #EDEDEC;
  --muted: #A8ACB3;
  --faint: #7D818A;
  --border: #45484E;
  --amber: #E9A552;
  --amber-soft: #4A3A20;
  --teal: #6FBBB4;
  --teal-soft: #29403E;
  --red: #E08080;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'IBM Plex Sans', -apple-system, sans-serif;
  font-size: 14.5px;
  line-height: 1.5;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, .num { font-family: 'Source Serif 4', Georgia, serif; }
a { color: var(--teal); }
::selection { background: var(--amber-soft); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.app { display: flex; min-height: 100vh; }

/* ---- Nav rail ---- */
.rail {
  width: 232px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 22px 14px;
  position: sticky;
  top: 0;
  height: 100vh;
}
.brand { display: flex; align-items: center; gap: 9px; padding: 0 8px 20px; }
.brand svg { flex-shrink: 0; }
.brand-name { font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 19px; letter-spacing: -0.01em; }
.brand-sub { font-size: 11px; color: var(--faint); margin-top: 1px; }
.nav { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.nav button {
  all: unset;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: var(--radius);
  font-size: 13.5px;
  color: var(--muted);
  cursor: pointer;
}
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button.active { background: var(--teal-soft); color: var(--teal); font-weight: 500; }
.nav button .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .55; flex-shrink: 0; }
.rail-footer { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border); }
.theme-toggle {
  all: unset;
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 9px 10px;
  border-radius: var(--radius);
  font-size: 13px;
  color: var(--muted);
  cursor: pointer;
}
.theme-toggle:hover { background: var(--surface-2); }
.switch { width: 32px; height: 18px; border-radius: 10px; background: var(--border); position: relative; flex-shrink: 0; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); transition: transform .15s ease; }
:root[data-theme="dark"] .switch { background: var(--teal); }
:root[data-theme="dark"] .switch::after { transform: translateX(14px); }

/* ---- Main ---- */
.main { flex: 1; min-width: 0; padding: 28px 36px 60px; max-width: 1180px; }
.page-head { margin-bottom: 22px; }
.page-head h1 { font-size: 25px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
.page-head p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 62ch; }

.grid { display: grid; gap: 14px; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 22px; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 17px;
}
.kpi-label { font-size: 11.5px; color: var(--faint); margin-bottom: 7px; }
.kpi-value { font-size: 26px; font-weight: 600; line-height: 1.1; }
.kpi-sub { font-size: 12px; color: var(--muted); margin-top: 5px; }
.up { color: var(--teal); } .down { color: var(--red); }

.two-col { grid-template-columns: 1.4fr 1fr; align-items: start; }
.section-title { font-size: 14.5px; font-weight: 600; margin: 0 0 3px; }
.section-desc { font-size: 12.5px; color: var(--muted); margin: 0 0 14px; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--faint); font-size: 11.5px; padding: 0 10px 8px 0; border-bottom: 1px solid var(--border); }
td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--border); }
tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.rank-badge { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 5px; background: var(--surface-2); font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }

.controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
select, .chip-group {
  font-family: inherit; font-size: 13px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 10px;
}
.chip-group { display: flex; gap: 6px; padding: 4px; flex-wrap: wrap; }
.chip {
  all: unset; font-size: 12.5px; padding: 5px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--border); color: var(--muted);
}
.chip.active { background: var(--teal); color: #fff; border-color: var(--teal); }
:root[data-theme="dark"] .chip.active { color: #12201f; }

.chart-wrap { width: 100%; overflow-x: auto; }
svg text { fill: var(--muted); font-family: 'IBM Plex Sans', sans-serif; }
.axis-line { stroke: var(--border); stroke-width: 1; }
.gridline { stroke: var(--border); stroke-width: 1; opacity: .6; }

.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--muted); }
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-swatch { width: 10px; height: 10px; border-radius: 2px; }

.tag { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 5px; background: var(--surface-2); color: var(--muted); }
.pill-good { background: var(--teal-soft); color: var(--teal); }
.pill-bad { background: #F3DDDD; color: var(--red); }
:root[data-theme="dark"] .pill-bad { background: #4A2E2E; }

.funnel { display: flex; flex-direction: column; gap: 0; }
.funnel-step { display: flex; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px dashed var(--border); }
.funnel-step:last-child { border-bottom: none; }
.funnel-bar-track { flex: 1; height: 26px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.funnel-bar-fill { height: 100%; background: var(--teal); }
.funnel-label { width: 230px; flex-shrink: 0; font-size: 13px; }
.funnel-value { width: 90px; text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; flex-shrink: 0; }
.funnel-delta { width: 130px; flex-shrink: 0; font-size: 12px; color: var(--red); text-align: right; }

.pipeline-flow { display: flex; align-items: stretch; gap: 0; flex-wrap: wrap; }
.flow-node { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; min-width: 130px; }
.flow-node .t { font-size: 12.5px; font-weight: 600; }
.flow-node .d { font-size: 11px; color: var(--muted); margin-top: 3px; }
.flow-arrow { display: flex; align-items: center; padding: 0 8px; color: var(--faint); font-size: 16px; }

.stack-list { display: flex; flex-direction: column; gap: 10px; }
.stack-row { display: flex; justify-content: space-between; font-size: 13px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.stack-row:last-child { border-bottom: none; }

footer.foot { margin-top: 30px; font-size: 11.5px; color: var(--faint); }

.tabbar-mobile { display: none; }

@media (max-width: 860px) {
  .app { flex-direction: column; }
  .rail { position: sticky; top: 0; width: 100%; height: auto; flex-direction: row; align-items: center; padding: 10px 14px; z-index: 10; border-right: none; border-bottom: 1px solid var(--border); }
  .brand { padding: 0 10px 0 0; }
  .nav { flex-direction: row; overflow-x: auto; gap: 2px; margin-top: 0; }
  .nav button span.label { display: none; }
  .nav button { padding: 8px; }
  .rail-footer { margin-top: 0; margin-left: auto; padding-top: 0; border-top: none; }
  .main { padding: 20px 16px 50px; }
  .two-col { grid-template-columns: 1fr; }
  .funnel-label { width: 150px; }
  .funnel-delta { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <path d="M2 17 L8 17 L11 8 L14 22 L17 12 L19 17 L24 17" stroke="var(--amber)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <div>
        <div class="brand-name">SkillPulse</div>
        <div class="brand-sub">Project 26 · Skill Demand</div>
      </div>
    </div>
    <div class="nav" id="nav">
      <button data-page="overview" class="active"><span class="dot"></span><span class="label">Overview</span></button>
      <button data-page="trends"><span class="dot"></span><span class="label">Skill Trends</span></button>
      <button data-page="growth"><span class="dot"></span><span class="label">Skill Growth</span></button>
      <button data-page="relationships"><span class="dot"></span><span class="label">Skill Relationships</span></button>
      <button data-page="quality"><span class="dot"></span><span class="label">Data Quality</span></button>
      <button data-page="pipeline"><span class="dot"></span><span class="label">Pipeline / About</span></button>
    </div>
    <div class="rail-footer">
      <button class="theme-toggle" id="themeToggle">
        <span id="themeLabel">Dark mode</span>
        <span class="switch"></span>
      </button>
    </div>
  </nav>
  <main class="main" id="main"></main>
</div>

<script id="dashboard-data" type="application/json">__DASHBOARD_DATA__</script>
<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById('dashboard-data').textContent);
const SKILLS = DATA.meta.skills;
const MONTHS = DATA.meta.months;
const TRACKED = ["snowflake","databricks","hadoop","dbt"];
const SERIES_COLORS = ["#B96F1E","#1F6F6B","#7A6FB9","#B23B3B","#3B7FB2","#8A8F97"];

function cssColor(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
const DISPLAY_NAMES = {
  python:"Python", sql:"SQL", spark:"Spark", airflow:"Airflow", kafka:"Kafka", hive:"Hive",
  aws:"AWS", azure:"Azure", gcp:"GCP", docker:"Docker", kubernetes:"Kubernetes",
  terraform:"Terraform", scala:"Scala", java:"Java", powerbi:"PowerBI", tableau:"Tableau",
  snowflake:"Snowflake", databricks:"Databricks", hadoop:"Hadoop", dbt:"dbt"
};
function titleCase(s){ return DISPLAY_NAMES[s] || (s.charAt(0).toUpperCase()+s.slice(1)); }
function fmt(n){ return n.toLocaleString('en-US'); }
function monthLabel(m){ const [y,mo]=m.split('-'); const names=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return names[parseInt(mo,10)-1]+" '"+y.slice(2); }

/* ---------- tiny SVG chart helpers (no external library) ---------- */
function lineChart(opts){
  // opts: {width,height,series:[{name,color,points:[{x label idx, y}]}], xLabels, yFormat, yMax}
  const W = opts.width || 640, H = opts.height || 260;
  const padL = 42, padR = 14, padT = 14, padB = 28;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  let yMax = opts.yMax;
  if (yMax === undefined) {
    yMax = Math.max(1, ...opts.series.flatMap(s => s.points.map(p => p.y)));
    yMax = yMax * 1.12;
  }
  const n = opts.xLabels.length;
  const xStep = n > 1 ? innerW / (n - 1) : 0;
  const xAt = i => padL + i * xStep;
  const yAt = v => padT + innerH - (v / yMax) * innerH;

  let gridlines = '';
  const ticks = 4;
  for (let t = 0; t <= ticks; t++) {
    const v = (yMax / ticks) * t;
    const y = yAt(v);
    gridlines += `<line class="gridline" x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}"/>`;
    gridlines += `<text x="${padL-8}" y="${y+3}" font-size="10" text-anchor="end">${opts.yFormat ? opts.yFormat(v) : Math.round(v)}</text>`;
  }
  let xlabels = '';
  const showEvery = Math.ceil(n / 9);
  for (let i = 0; i < n; i++) {
    if (i % showEvery !== 0 && i !== n-1) continue;
    xlabels += `<text x="${xAt(i)}" y="${H-8}" font-size="10" text-anchor="middle">${esc(opts.xLabels[i])}</text>`;
  }
  let paths = '';
  opts.series.forEach(s => {
    const d = s.points.map((p,i) => `${i===0?'M':'L'}${xAt(i).toFixed(1)},${yAt(p.y).toFixed(1)}`).join(' ');
    paths += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.points.forEach((p,i) => {
      paths += `<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(p.y).toFixed(1)}" r="2.4" fill="${s.color}"><title>${esc(s.name)} · ${esc(opts.xLabels[i])}: ${fmt(p.y)}</title></circle>`;
    });
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="line chart">
    ${gridlines}
    <line class="axis-line" x1="${padL}" x2="${padL}" y1="${padT}" y2="${H-padB}"/>
    <line class="axis-line" x1="${padL}" x2="${W-padR}" y1="${H-padB}" y2="${H-padB}"/>
    ${paths}${xlabels}
  </svg>`;
}

function barChart(opts){
  // opts: {width,height,bars:[{label,value,color}], yFormat}
  const W = opts.width || 640, H = opts.height || 280;
  const padL = 44, padR = 14, padT = 14, padB = 46;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const n = opts.bars.length;
  const gap = 10;
  const bw = (innerW - gap * (n-1)) / n;
  const yMax = Math.max(1, ...opts.bars.map(b=>b.value)) * 112/1000 * 1000 / 1000 * 1.12;
  const yAt = v => padT + innerH - (v/yMax)*innerH;
  let gridlines = '';
  for (let t=0;t<=4;t++){ const v=(yMax/4)*t; const y=yAt(v);
    gridlines += `<line class="gridline" x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}"/>`;
    gridlines += `<text x="${padL-8}" y="${y+3}" font-size="10" text-anchor="end">${opts.yFormat?opts.yFormat(v):Math.round(v)}</text>`;
  }
  let bars = '';
  opts.bars.forEach((b,i)=>{
    const x = padL + i*(bw+gap);
    const y = yAt(b.value);
    const h = (padT+innerH) - y;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${b.color}" rx="2"><title>${esc(b.label)}: ${fmt(b.value)}</title></rect>`;
    bars += `<text x="${(x+bw/2).toFixed(1)}" y="${H-padB+16}" font-size="10.5" text-anchor="middle" transform="rotate(0)">${esc(b.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="bar chart">
    ${gridlines}
    <line class="axis-line" x1="${padL}" x2="${padL}" y1="${padT}" y2="${padT+innerH}"/>
    <line class="axis-line" x1="${padL}" x2="${W-padR}" y1="${padT+innerH}" y2="${padT+innerH}"/>
    ${bars}
  </svg>`;
}

function hbarChart(opts){
  // horizontal bars: opts.bars [{label, value, color}], maxLabelWidth
  const W = opts.width || 560;
  const rowH = 26, gap = 8;
  const n = opts.bars.length;
  const H = n * (rowH+gap);
  const labelW = opts.labelWidth || 100;
  const valueW = 56;
  const trackW = W - labelW - valueW - 10;
  const maxV = Math.max(1, ...opts.bars.map(b=>b.value));
  let rows = '';
  opts.bars.forEach((b,i)=>{
    const y = i*(rowH+gap);
    const w = (b.value/maxV) * trackW;
    rows += `<text x="0" y="${y+rowH/2+4}" font-size="12">${esc(b.label)}</text>`;
    rows += `<rect x="${labelW}" y="${y+3}" width="${trackW}" height="${rowH-6}" fill="var(--surface-2)" rx="3"/>`;
    rows += `<rect x="${labelW}" y="${y+3}" width="${Math.max(2,w).toFixed(1)}" height="${rowH-6}" fill="${b.color}" rx="3"><title>${esc(b.label)}: ${fmt(b.value)}</title></rect>`;
    rows += `<text x="${labelW+trackW+8}" y="${y+rowH/2+4}" font-size="12" text-anchor="start">${opts.valueFormat?opts.valueFormat(b.value):fmt(b.value)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${rows}</svg>`;
}

/* ---------- page renderers ---------- */
const pages = {};

pages.overview = function(){
  const kpi = DATA.meta.kpi;
  const latestMonth = MONTHS[MONTHS.length-1];
  const top10 = DATA.top10_by_month[latestMonth];
  const prevMonth = MONTHS[MONTHS.length-2];
  const trendSeries = TRACKED.map((s,i)=>({
    name: titleCase(s), color: SERIES_COLORS[i],
    points: DATA.skill_trends[s].map(r=>({x:r.month, y:r.postings}))
  }));

  return `
  <div class="page-head">
    <h1>Overview</h1>
    <p>SkillPulse tracks which technical skills are gaining ground in job postings, using 18 months of cleaned, deduplicated listing data.</p>
  </div>
  <div class="grid kpis">
    <div class="card"><div class="kpi-label">Job postings analyzed</div><div class="kpi-value">${fmt(kpi.total_postings)}</div><div class="kpi-sub">${fmt(kpi.valid_postings)} passed data-quality checks</div></div>
    <div class="card"><div class="kpi-label">Companies</div><div class="kpi-value">${fmt(kpi.companies)}</div><div class="kpi-sub">across 8 sectors, 10 cities</div></div>
    <div class="card"><div class="kpi-label">Tracked skills</div><div class="kpi-value">${kpi.canonical_skills}</div><div class="kpi-sub">normalized from 57 raw variants</div></div>
    <div class="card"><div class="kpi-label">Months analyzed</div><div class="kpi-value">${kpi.months_analyzed}</div><div class="kpi-sub">${monthLabel(MONTHS[0])} – ${monthLabel(latestMonth)}</div></div>
    <div class="card"><div class="kpi-label">Top skill this month</div><div class="kpi-value">${titleCase(kpi.top_current_skill)}</div><div class="kpi-sub">${kpi.top_current_skill_share}% of postings</div></div>
    <div class="card"><div class="kpi-label">Fastest growing</div><div class="kpi-value">${titleCase(kpi.fastest_growing_skill)}</div><div class="kpi-sub up">+${kpi.fastest_growing_skill_pct}% QoQ</div></div>
  </div>

  <div class="grid two-col">
    <div class="card">
      <div class="section-title">Top 10 skills — ${monthLabel(latestMonth)}</div>
      <div class="section-desc">Share of that month's ${fmt(Math.round(DATA.data_quality.valid_postings / MONTHS.length))} valid postings mentioning each skill.</div>
      <div class="chart-wrap">${barChart({bars: top10.map((r,i)=>({label:titleCase(r.skill), value:r.postings, color: TRACKED.includes(r.skill)?"var(--amber)":"var(--teal)"})), height: 260})}</div>
    </div>
    <div class="card">
      <div class="section-title">Latest month vs. previous</div>
      <div class="section-desc">Tracked-skill postings, ${monthLabel(prevMonth)} → ${monthLabel(latestMonth)}</div>
      <table>
        <thead><tr><th>Skill</th><th class="num">${monthLabel(prevMonth)}</th><th class="num">${monthLabel(latestMonth)}</th><th class="num">Δ</th></tr></thead>
        <tbody>
        ${TRACKED.map(s=>{
          const rows = DATA.skill_trends[s];
          const prev = rows.find(r=>r.month===prevMonth), curr = rows.find(r=>r.month===latestMonth);
          const delta = curr.postings - prev.postings;
          return `<tr><td>${titleCase(s)}</td><td class="num">${fmt(prev.postings)}</td><td class="num">${fmt(curr.postings)}</td><td class="num ${delta>=0?'up':'down'}">${delta>=0?'+':''}${fmt(delta)}</td></tr>`;
        }).join('')}
        </tbody>
      </table>
    </div>
  </div>

  <div class="card" style="margin-top:14px;">
    <div class="section-title">Skill demand trend — the four tracked skills</div>
    <div class="section-desc">Monthly posting count, ${monthLabel(MONTHS[0])} through ${monthLabel(latestMonth)}.</div>
    <div class="chart-wrap">${lineChart({series: trendSeries, xLabels: MONTHS.map(monthLabel), height: 280})}</div>
    <div class="legend">${trendSeries.map(s=>`<div class="legend-item"><span class="legend-swatch" style="background:${s.color}"></span>${s.name}</div>`).join('')}</div>
  </div>
  `;
};

pages.trends = function(state){
  state.trendSkills = state.trendSkills || ["snowflake","databricks","hadoop"];
  state.trendMonthEnd = state.trendMonthEnd || MONTHS.length - 1;
  state.trendMonthStart = state.trendMonthStart || 0;
  state.trendMode = state.trendMode || "count";

  const range = MONTHS.slice(state.trendMonthStart, state.trendMonthEnd+1);
  const series = state.trendSkills.map((s,i)=>({
    name: titleCase(s), color: SERIES_COLORS[i%SERIES_COLORS.length],
    points: DATA.skill_trends[s].filter(r=>range.includes(r.month)).map(r=>({x:r.month, y: state.trendMode==='count'?r.postings:r.share}))
  }));
  const rankSeries = state.trendSkills.map((s,i)=>({
    name: titleCase(s), color: SERIES_COLORS[i%SERIES_COLORS.length],
    points: DATA.skill_trends[s].filter(r=>range.includes(r.month)).map(r=>({x:r.month, y: 21-r.rank}))
  }));
  const top10 = DATA.top10_by_month[range[range.length-1]];

  return `
  <div class="page-head">
    <h1>Skill Trends</h1>
    <p>Choose a month range and up to six skills to compare posting volume, market share, and rank movement over time.</p>
  </div>
  <div class="controls">
    <select id="trendStart">${MONTHS.map((m,i)=>`<option value="${i}" ${i===state.trendMonthStart?'selected':''}>${monthLabel(m)}</option>`).join('')}</select>
    <span style="align-self:center;color:var(--faint);font-size:12px;">to</span>
    <select id="trendEnd">${MONTHS.map((m,i)=>`<option value="${i}" ${i===state.trendMonthEnd?'selected':''}>${monthLabel(m)}</option>`).join('')}</select>
    <div class="chip-group" id="modeChips">
      <button class="chip ${state.trendMode==='count'?'active':''}" data-mode="count">Posting count</button>
      <button class="chip ${state.trendMode==='share'?'active':''}" data-mode="share">Market share %</button>
    </div>
  </div>
  <div class="controls" id="skillChips">
    ${SKILLS.map(s=>`<button class="chip ${state.trendSkills.includes(s)?'active':''}" data-skill="${s}">${titleCase(s)}</button>`).join('')}
  </div>

  <div class="card">
    <div class="section-title">${state.trendMode==='count'?'Posting count':'Market share'} over time</div>
    <div class="chart-wrap">${series.length ? lineChart({series, xLabels: range.map(monthLabel), height: 280, yFormat: v=>state.trendMode==='share'?Math.round(v)+'%':Math.round(v)}) : '<p style="color:var(--muted)">Select at least one skill.</p>'}</div>
    <div class="legend">${series.map(s=>`<div class="legend-item"><span class="legend-swatch" style="background:${s.color}"></span>${s.name}</div>`).join('')}</div>
  </div>

  <div class="grid two-col" style="margin-top:14px;">
    <div class="card">
      <div class="section-title">Rank movement</div>
      <div class="section-desc">Higher on the chart = closer to #1 that month.</div>
      <div class="chart-wrap">${series.length ? lineChart({series: rankSeries, xLabels: range.map(monthLabel), height: 240, yMax: 20, yFormat: v=>21-Math.round(v)}) : ''}</div>
    </div>
    <div class="card">
      <div class="section-title">Top 10 — ${monthLabel(range[range.length-1])}</div>
      <table>
        <thead><tr><th>#</th><th>Skill</th><th class="num">Postings</th></tr></thead>
        <tbody>${top10.map(r=>`<tr><td><span class="rank-badge">${r.rank}</span></td><td>${titleCase(r.skill)}</td><td class="num">${fmt(r.postings)}</td></tr>`).join('')}</tbody>
      </table>
    </div>
  </div>
  `;
};

pages.growth = function(){
  const rows = DATA.growth_latest_quarter;
  const quarter = rows[0] ? rows[0].quarter : '';
  const top8 = rows.slice(0,8);
  return `
  <div class="page-head">
    <h1>Skill Growth</h1>
    <p>Quarter-on-quarter change for every tracked skill, ${quarter}. Growth % = (current quarter − previous quarter) ÷ previous quarter.</p>
  </div>
  <div class="card">
    <div class="section-title">Fastest-growing skills, ${quarter}</div>
    <div class="chart-wrap">${barChart({bars: top8.map((r,i)=>({label:titleCase(r.skill), value:r.growth_pct, color: TRACKED.includes(r.skill)?"var(--amber)":"var(--teal)"})), height:240, yFormat:v=>Math.round(v)+'%'})}</div>
  </div>
  <div class="card" style="margin-top:14px;">
    <div class="section-title">Full ranking — ${quarter}</div>
    <table>
      <thead><tr><th>Rank</th><th>Skill</th><th class="num">Prev. quarter</th><th class="num">This quarter</th><th class="num">Change</th><th class="num">QoQ growth</th></tr></thead>
      <tbody>
      ${rows.map((r,i)=>`<tr>
        <td><span class="rank-badge">${i+1}</span></td>
        <td>${titleCase(r.skill)}</td>
        <td class="num">${fmt(r.previous_quarter)}</td>
        <td class="num">${fmt(r.current_quarter)}</td>
        <td class="num ${r.change>=0?'up':'down'}">${r.change>=0?'+':''}${fmt(r.change)}</td>
        <td class="num"><span class="tag ${r.growth_pct>=0?'pill-good':'pill-bad'}">${r.growth_pct>=0?'+':''}${r.growth_pct}%</span></td>
      </tr>`).join('')}
      </tbody>
    </table>
  </div>
  `;
};

pages.relationships = function(state){
  state.relSkill = state.relSkill || "snowflake";
  const rows = DATA.relationships[state.relSkill] || [];
  return `
  <div class="page-head">
    <h1>Skill Relationships</h1>
    <p>Select a skill to see which other skills appear most often on the same job posting, ranked by how many postings mention both.</p>
  </div>
  <div class="controls">
    <select id="relSelect">${SKILLS.map(s=>`<option value="${s}" ${s===state.relSkill?'selected':''}>${titleCase(s)}</option>`).join('')}</select>
  </div>
  <div class="grid two-col">
    <div class="card">
      <div class="section-title">Top companion skills for ${titleCase(state.relSkill)}</div>
      <div class="section-desc">Bar length = number of postings mentioning both skills, summed across all 18 months.</div>
      <div class="chart-wrap">${rows.length ? hbarChart({bars: rows.map((r,i)=>({label:titleCase(r.companion), value:r.pair_postings, color: SERIES_COLORS[i%SERIES_COLORS.length]})), labelWidth:92, height:280}) : '<p style="color:var(--muted)">No co-occurring skills found.</p>'}</div>
    </div>
    <div class="card">
      <div class="section-title">Detail</div>
      <table>
        <thead><tr><th>Companion</th><th class="num">Postings</th><th class="num">Confidence</th><th class="num">Lift</th></tr></thead>
        <tbody>${rows.map(r=>`<tr><td>${titleCase(r.companion)}</td><td class="num">${fmt(r.pair_postings)}</td><td class="num">${r.confidence}%</td><td class="num">${r.lift}×</td></tr>`).join('')}</tbody>
      </table>
      <p class="section-desc" style="margin-top:12px;">Confidence: of postings with ${titleCase(state.relSkill)}, % that also mention the companion. Lift &gt; 1× means the pair co-occurs more than chance alone would predict.</p>
    </div>
  </div>
  `;

pages.quality = function(){
  const dq = DATA.data_quality;
  const steps = [
    {label: "Raw postings (Bronze)", value: dq.raw_postings, delta: null},
    {label: "After deduplication", value: dq.clean_postings, delta: -dq.duplicates_removed},
    {label: "Missing / \"Not specified\" skills", value: dq.clean_postings - dq.missing_or_notspecified, delta: -dq.missing_or_notspecified},
    {label: "Unknown company removed", value: dq.clean_postings - dq.missing_or_notspecified - dq.unknown_company, delta: -dq.unknown_company},
    {label: "Invalid date removed", value: dq.valid_postings, delta: -dq.invalid_date},
  ];
  const maxV = dq.raw_postings;
  const rejectBars = [
    {label: "Missing / not specified", value: dq.missing_or_notspecified, color: "var(--amber)"},
    {label: "Unknown company", value: dq.unknown_company, color: "var(--teal)"},
    {label: "Invalid date", value: dq.invalid_date, color: "#7A6FB9"},
  ];
  return `
  <div class="page-head">
    <h1>Data Quality</h1>
    <p>Every number below is computed by the pipeline, not entered by hand — see <code>validation_report.json</code> for the full 17-check audit trail.</p>
  </div>
  <div class="grid kpis">
    <div class="card"><div class="kpi-label">Raw postings</div><div class="kpi-value">${fmt(dq.raw_postings)}</div></div>
    <div class="card"><div class="kpi-label">Clean postings</div><div class="kpi-value">${fmt(dq.clean_postings)}</div></div>
    <div class="card"><div class="kpi-label">Valid postings (Gold)</div><div class="kpi-value">${fmt(dq.valid_postings)}</div></div>
    <div class="card"><div class="kpi-label">Quality score</div><div class="kpi-value">${dq.quality_score_pct}%</div><div class="kpi-sub">valid ÷ clean postings</div></div>
  </div>
  <div class="card">
    <div class="section-title">Bronze → Silver funnel</div>
    <div class="section-desc">${fmt(dq.raw_postings)} raw postings resolve to ${fmt(dq.valid_postings)} valid, analytics-ready postings.</div>
    <div class="funnel">
      ${steps.map(s=>`<div class="funnel-step">
        <div class="funnel-label">${s.label}</div>
        <div class="funnel-bar-track"><div class="funnel-bar-fill" style="width:${(s.value/maxV*100).toFixed(1)}%"></div></div>
        <div class="funnel-value">${fmt(s.value)}</div>
        <div class="funnel-delta">${s.delta!==null ? s.delta+' rows' : ''}</div>
      </div>`).join('')}
    </div>
  </div>
  <div class="grid two-col" style="margin-top:14px;">
    <div class="card">
      <div class="section-title">Rejection reasons</div>
      <div class="chart-wrap">${barChart({bars: rejectBars, height:220})}</div>
    </div>
    <div class="card">
      <div class="section-title">Skill normalization</div>
      <div class="section-desc">Raw skill text arrives in mixed case, comma- or semicolon-delimited, sometimes padded with stray spaces.</div>
      <div class="stack-list">
        <div class="stack-row"><span>Distinct raw skill strings</span><strong>${dq.raw_skill_variants}</strong></div>
        <div class="stack-row"><span>Canonical skills after trim + lowercase</span><strong>${dq.canonical_skills}</strong></div>
      </div>
      <p class="section-desc" style="margin-top:12px;">Example: <code>"Snowflake"</code>, <code>"SNOWFLAKE"</code>, and <code>" Snowflake "</code> all normalize to <code>snowflake</code>.</p>
    </div>
  </div>
  `;
};

pages.pipeline = function(){
  const flow = [
    {t:"Generator", d:"Seed 26, deterministic"},
    {t:"Raw CSV", d:"companies, postings"},
    {t:"Bronze", d:"Raw, provenance added"},
    {t:"Silver", d:"Dedup, clean, normalize"},
    {t:"Gold", d:"Skill-month, skill-pair"},
    {t:"CSV Export", d:"To Snowflake stage"},
    {t:"Snowflake", d:"COPY INTO, SQL"},
    {t:"SkillPulse", d:"This dashboard"},
  ];
  return `
  <div class="page-head">
    <h1>Pipeline / About</h1>
    <p>How data moves from a seeded generator to this dashboard, and what each layer is responsible for.</p>
  </div>
  <div class="card">
    <div class="section-title">Architecture</div>
    <div class="pipeline-flow" style="margin-top:10px;">
      ${flow.map((f,i)=>`${i>0?'<div class="flow-arrow">→</div>':''}<div class="flow-node"><div class="t">${f.t}</div><div class="d">${f.d}</div></div>`).join('')}
    </div>
  </div>
  <div class="grid two-col" style="margin-top:14px;">
    <div class="card">
      <div class="section-title">What each layer does</div>
      <div class="stack-list">
        <div class="stack-row"><span>Bronze</span><span style="color:var(--muted)">Raw load, every column a string, provenance columns added, nothing cleaned</span></div>
        <div class="stack-row"><span>Silver</span><span style="color:var(--muted)">Dedup on posting_id, skill split &amp; normalize once, reject invalid rows with a reason</span></div>
        <div class="stack-row"><span>Gold</span><span style="color:var(--muted)">Skill-month and skill-pair-month aggregates that answer the three analytical questions</span></div>
      </div>
    </div>
    <div class="card">
      <div class="section-title">Technology stack</div>
      <div class="stack-list">
        <div class="stack-row"><span>Data engineering</span><span style="color:var(--muted)">Python, PySpark, Delta Lake, Databricks</span></div>
        <div class="stack-row"><span>Warehouse</span><span style="color:var(--muted)">Snowflake, Snowflake SQL, Stages, COPY INTO</span></div>
        <div class="stack-row"><span>Dashboard</span><span style="color:var(--muted)">Static HTML/CSS/JS reading Gold-layer JSON</span></div>
      </div>
    </div>
  </div>
  <div class="card" style="margin-top:14px;">
    <div class="section-title">Run status</div>
    <p class="section-desc">Last local pipeline run: ${DATA.meta.generated_at}. Seed: ${DATA.meta.seed}. Every number on this dashboard traces back to that run's <code>validation_report.json</code> — see <a href="https://github.com" target="_blank" rel="noopener">the repository</a> for the full audit trail and source code.</p>
  </div>
  `;
};

/* ---------- shell / routing ---------- */
const state = {};
function render(page){
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active', b.dataset.page===page));
  const main = document.getElementById('main');
  main.innerHTML = pages[page](state) + `<footer class="foot">SkillPulse — Project 26, Job Postings Skill Demand · seed 26 · data generated ${DATA.meta.generated_at}</footer>`;
  wireControls(page);
  window.scrollTo(0,0);
}
function wireControls(page){
  if (page === 'trends') {
    document.getElementById('trendStart').onchange = e => { state.trendMonthStart = Math.min(+e.target.value, state.trendMonthEnd); render('trends'); };
    document.getElementById('trendEnd').onchange = e => { state.trendMonthEnd = Math.max(+e.target.value, state.trendMonthStart); render('trends'); };
    document.querySelectorAll('#modeChips .chip').forEach(c=>c.onclick=()=>{ state.trendMode=c.dataset.mode; render('trends'); });
    document.querySelectorAll('#skillChips .chip').forEach(c=>c.onclick=()=>{
      const s = c.dataset.skill;
      const i = state.trendSkills.indexOf(s);
      if (i>=0) { if(state.trendSkills.length>1) state.trendSkills.splice(i,1); }
      else if (state.trendSkills.length < 6) state.trendSkills.push(s);
      render('trends');
    });
  }
  if (page === 'relationships') {
    document.getElementById('relSelect').onchange = e => { state.relSkill = e.target.value; render('relationships'); };
  }
}
document.getElementById('nav').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-page]');
  if (btn) render(btn.dataset.page);
});

/* ---------- theme ---------- */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeLabel').textContent = t === 'dark' ? 'Light mode' : 'Dark mode';
  try { localStorage.setItem('skillpulse-theme', t); } catch(e){}
}
document.getElementById('themeToggle').onclick = () => {
  const curr = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  applyTheme(curr === 'dark' ? 'light' : 'dark');
  render(document.querySelector('.nav button.active').dataset.page);
};
let savedTheme = 'light';
try { savedTheme = localStorage.getItem('skillpulse-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch(e){}
applyTheme(savedTheme);

render('overview');
})();
</script>
</body>
</html>
